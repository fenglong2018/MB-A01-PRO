; SSCOM 多字符串导入（扩展窗口 → 导入）
; 编码须 ANSI/GBK。UTF-8 注释会乱码，命令仍可用。
; "=" 后 A=ASCII，H=HEX。N10x=顺序,注释,延时ms；顺序 0=不参与循环发送。
; SSCOM 勾选「加回车换行」；DTR 打开；115200 8N1。
; 不要和 shy_host 同时占同一个 COM。
N101=0,测试连接,10
N1=A,{"id":1,"cmd":"ping"}
N102=1,获取模式,100
N2=A,{"id":2,"cmd":"mode.get"}
N103=2,开启GNSS透传,10
N3=A,{"id":3,"cmd":"stream.set","name":"gnss","enable":1}
N104=3,关闭GNSS透传,10
N4=A,{"id":6,"cmd":"stream.set","name":"gnss","enable":0}
N105=0,开启RDSS透传,10
N5=A,{"id":4,"cmd":"stream.set","name":"rdss","enable":1}
N106=0,关闭RDSS透传,10
N6=A,{"id":7,"cmd":"stream.set","name":"rdss","enable":0}
